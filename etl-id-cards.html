<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ETL Staff ID Cards</title>
<style>
  :root{
    --etl-red:#b23a3a;
    --etl-red-dark:#8f2d2d;
    --ink:#1c1c1c;
    --muted:#666;
    --line:#e2e2e2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#efefef;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    color:var(--ink);
    padding:28px 16px;
  }
  .page-head{
    text-align:center;
    margin-bottom:22px;
  }
  .page-head h1{
    margin:0 0 4px;
    font-size:20px;
    letter-spacing:.5px;
  }
  .page-head p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  .grid{
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    justify-content:center;
    max-width:1100px;
    margin:0 auto;
  }

  /* ---------- ID CARD ---------- */
  .card{
    width:320px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
    border:1px solid #ddd;
  }
  .card-top{
    background:linear-gradient(135deg,var(--etl-red),var(--etl-red-dark));
    color:#fff;
    padding:16px 16px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{width:58px;height:58px;flex:0 0 58px;}
  .brand{line-height:1.1;}
  .brand .name{font-size:16px;font-weight:800;letter-spacing:.5px;}
  .brand .sub{font-size:10px;letter-spacing:2px;opacity:.9;margin-top:2px;}
  .brand .tag{
    display:inline-block;
    margin-top:6px;
    font-size:9px;
    letter-spacing:1.5px;
    background:rgba(255,255,255,.18);
    padding:2px 8px;
    border-radius:20px;
    text-transform:uppercase;
  }

  .card-body{padding:16px;display:flex;flex-direction:column;align-items:center;}

  /* Photo placeholder */
  .photo{
    width:110px;height:130px;
    border:2px dashed var(--etl-red);
    border-radius:10px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    color:var(--etl-red);
    background:#fdf6f6;
    margin-top:-42px;           /* overlaps header a touch */
    background-clip:padding-box;
    box-shadow:0 0 0 4px #fff;
    text-align:center;
    overflow:hidden;
  }
  .photo svg{width:40px;height:40px;opacity:.55;}
  .photo span{font-size:10px;letter-spacing:1px;margin-top:6px;font-weight:600;}
  .photo img{width:100%;height:100%;object-fit:cover;}

  .emp-name{
    font-size:20px;font-weight:800;margin-top:12px;text-align:center;
    color:var(--ink);
  }
  .emp-desg{
    margin-top:6px;
    font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
    color:#fff;background:var(--etl-red);
    padding:4px 12px;border-radius:20px;
  }

  .details{width:100%;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  .row{display:flex;gap:10px;margin-bottom:10px;font-size:12px;align-items:flex-start;}
  .row:last-child{margin-bottom:0;}
  .row .ic{flex:0 0 26px;height:26px;border-radius:7px;background:#f3e9e9;
    display:flex;align-items:center;justify-content:center;color:var(--etl-red);}
  .row .ic svg{width:14px;height:14px;}
  .row .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;}
  .row .v{color:var(--ink);font-weight:600;line-height:1.35;}

  .card-foot{
    margin-top:auto;
    background:#faf3f3;
    border-top:1px solid var(--line);
    padding:8px 16px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:10px;color:var(--muted);
  }
  .card-foot b{color:var(--etl-red);}

  /* ---------- PRINT ---------- */
  @media print{
    body{background:#fff;padding:0;}
    .page-head{display:none;}
    .grid{gap:10mm;}
    .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid;}
    .card-top{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .emp-desg,.row .ic,.card-foot{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="page-head">
  <h1>Eat Truck Love — Staff Identity Cards</h1>
  <p>Photo boxes are placeholders — send each photo and it will be added to the matching card.</p>
</div>

<div class="grid" id="cards"></div>

<!-- ETL logo, recreated as reusable SVG symbol -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="etl-logo" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="100" fill="#b23a3a"/>
    <!-- tilted black tag with E T L -->
    <g transform="rotate(-8 78 100)">
      <rect x="46" y="40" width="60" height="120" rx="3" fill="#141414" stroke="#ffffff" stroke-width="4"/>
      <text x="76" y="72" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff" text-anchor="middle">E</text>
      <text x="76" y="112" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff" text-anchor="middle">T</text>
      <text x="76" y="152" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#fff" text-anchor="middle">L</text>
    </g>
    <!-- AT / RUCK / OVE -->
    <text x="112" y="72"  font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#fff">AT</text>
    <text x="112" y="112" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#fff">RUCK</text>
    <text x="112" y="152" font-family="Arial, sans-serif" font-weight="800" font-size="30" fill="#fff">OVE</text>
    <text x="100" y="182" font-family="Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#141414" text-anchor="middle">BY AZIMUTH</text>
  </symbol>
</svg>

<script>
  const staff = [
    { id:"ETL-HK-001", name:"Deepak",  desg:"Housekeeping Supervisor",
      addr:"Noida Sector 122, near Parthala Chowk, Radha Kunj Colony", phone:"" },
    { id:"ETL-HK-002", name:"Delip",   desg:"Housekeeping Staff",
      addr:"Noida Sector 122, near Parthala Chowk, Radha Kunj Colony", phone:"" },
    { id:"ETL-HK-003", name:"Anshu",   desg:"Housekeeping Staff",
      addr:"Noida Sector 52, Gijod", phone:"" },
    { id:"ETL-HK-004", name:"Sunil",   desg:"Housekeeping Staff",
      addr:"Noida Sector 51, Hoshiyarpur", phone:"" },
    { id:"ETL-MG-001", name:"Vansh Singh Fartyal", desg:"Floor Manager",
      addr:"Noida Sector 33, Morna", phone:"9953757491" },
  ];

  const icPhone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9z"/></svg>';
  const icPin   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  const icId    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M7 11h2"/><circle cx="15" cy="12" r="2"/></svg>';
  const icCam   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';

  const el = document.getElementById("cards");
  staff.forEach(p => {
    const phoneRow = p.phone
      ? `<div class="row"><div class="ic">${icPhone}</div><div><div class="k">Contact</div><div class="v">${p.phone}</div></div></div>`
      : "";
    el.insertAdjacentHTML("beforeend", `
      <div class="card">
        <div class="card-top">
          <svg class="logo"><use href="#etl-logo"/></svg>
          <div class="brand">
            <div class="name">EAT&nbsp;TRUCK&nbsp;LOVE</div>
            <div class="sub">BY AZIMUTH</div>
            <span class="tag">Staff ID Card</span>
          </div>
        </div>
        <div class="card-body">
          <div class="photo" data-name="${p.name}">
            ${icCam}<span>PHOTO</span>
          </div>
          <div class="emp-name">${p.name}</div>
          <div class="emp-desg">${p.desg}</div>
          <div class="details">
            <div class="row"><div class="ic">${icId}</div><div><div class="k">Employee ID</div><div class="v">${p.id}</div></div></div>
            <div class="row"><div class="ic">${icPin}</div><div><div class="k">Address</div><div class="v">${p.addr}</div></div></div>
            ${phoneRow}
          </div>
        </div>
        <div class="card-foot">
          <span>Property of <b>ETL</b></span>
          <span>If found, please return</span>
        </div>
      </div>
    `);
  });
</script>
</body>
</html>
