<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ETL Staff ID Cards</title>
<style>
  :root{
    --etl-red:#d62e2b;
    --etl-red-dark:#a11f1d;
    --ink:#20232a;
    --muted:#7a7f87;
    --line:#eceef1;
    --soft:#f6f4f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#e9ebee;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    color:var(--ink);
    padding:34px 16px;
  }
  .page-head{text-align:center;margin-bottom:26px;}
  .page-head h1{margin:0 0 4px;font-size:21px;letter-spacing:.4px;}
  .page-head p{margin:0;color:var(--muted);font-size:13px;}
  .grid{
    display:flex;flex-wrap:wrap;gap:26px;
    justify-content:center;max-width:1180px;margin:0 auto;
  }

  /* ---------- ID CARD ---------- */
  .card{
    position:relative;
    width:340px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(30,30,40,.18);
    display:flex;flex-direction:column;
    border:1px solid #e3e3e6;
  }
  /* watermark */
  .card .wm{
    position:absolute;left:50%;top:57%;transform:translate(-50%,-50%);
    width:255px;height:255px;
    opacity:.05;pointer-events:none;z-index:0;
  }
  .card .wm-real{object-fit:contain;}

  /* Header */
  .card-top{
    position:relative;z-index:1;
    background:linear-gradient(135deg,var(--etl-red) 0%,var(--etl-red-dark) 100%);
    color:#fff;text-align:center;
    padding:20px 16px 54px;
  }
  .logo-badge{
    width:88px;height:88px;border-radius:50%;
    background:#fff;margin:0 auto 10px;position:relative;overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.85);
  }
  .logo-badge .logo-real{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff;z-index:2;}
  .logo-badge .logo-fb{position:absolute;inset:0;margin:auto;width:68px;height:68px;z-index:1;}
  .brand-name{font-size:18px;font-weight:800;letter-spacing:3px;}
  .brand-sub{font-size:9px;letter-spacing:4px;opacity:.9;margin-top:3px;}
  /* wave divider */
  .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;display:block;}

  /* Body */
  .card-body{
    position:relative;z-index:1;
    padding:0 20px 18px;
    display:flex;flex-direction:column;align-items:center;
  }
  .photo{
    width:118px;height:140px;border-radius:14px;
    margin-top:-40px;
    background:var(--soft);
    border:4px solid #fff;
    box-shadow:0 6px 16px rgba(0,0,0,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--etl-red);overflow:hidden;text-align:center;
  }
  .photo svg{width:38px;height:38px;opacity:.5;}
  .photo span{font-size:9px;letter-spacing:1.5px;margin-top:6px;font-weight:700;}
  .photo img{width:100%;height:100%;object-fit:cover;}

  .emp-name{font-size:22px;font-weight:800;margin-top:14px;text-align:center;letter-spacing:.3px;}
  .emp-desg{
    margin-top:8px;font-size:10.5px;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;color:#fff;
    background:linear-gradient(135deg,var(--etl-red),var(--etl-red-dark));
    padding:5px 16px;border-radius:30px;
    box-shadow:0 3px 8px rgba(189,59,57,.35);
  }

  .details{width:100%;margin-top:18px;}
  .row{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--soft);border-radius:12px;
    padding:10px 12px;margin-bottom:9px;
  }
  .row:last-child{margin-bottom:0;}
  .row .ic{
    flex:0 0 30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--etl-red),var(--etl-red-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .row .ic svg{width:15px;height:15px;}
  .row .k{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
  .row .v{color:var(--ink);font-weight:600;font-size:12.5px;line-height:1.35;margin-top:1px;}
  .row .v .pending{color:#b9bcc2;font-weight:600;font-style:italic;font-size:11.5px;letter-spacing:.3px;}

  /* Footer */
  .card-foot{
    position:relative;z-index:1;
    margin-top:6px;
    background:linear-gradient(135deg,var(--etl-red),var(--etl-red-dark));
    color:#fff;padding:11px 20px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:9.5px;letter-spacing:.5px;
  }
  .card-foot .sign{text-align:center;line-height:1.1;}
  .card-foot .sign .line{width:88px;border-top:1px solid rgba(255,255,255,.6);margin-bottom:3px;height:14px;}
  .card-foot .sign small{opacity:.85;font-size:8.5px;letter-spacing:1px;}
  .card-foot .idtag{text-align:right;}
  .card-foot .idtag b{font-size:11px;letter-spacing:1px;}
  .card-foot .idtag small{display:block;opacity:.85;font-size:8px;letter-spacing:1px;}

  /* ---------- PRINT ---------- */
  @media print{
    body{background:#fff;padding:0;}
    .page-head{display:none;}
    .grid{gap:8mm;}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;}
    .card-top,.emp-desg,.row .ic,.card-foot{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<div class="page-head">
  <h1>Eat Truck Love &mdash; Staff Identity Cards</h1>
  <p>Photo boxes are placeholders &mdash; send each photo and it will be placed on the matching card.</p>
</div>

<div class="grid" id="cards"></div>

<!-- ETL logo, recreated as reusable SVG symbol -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="etl-logo" viewBox="0 0 240 240">
    <circle cx="120" cy="120" r="112" fill="#d62e2b"/>
    <g font-family="'Arial Black', Arial, sans-serif" font-weight="900">
      <g transform="rotate(-7 88 118)">
        <rect x="66" y="62" width="45" height="112" rx="4" fill="#141414" stroke="#fff" stroke-width="5"/>
      </g>
      <text x="88" y="100" font-size="37" fill="#fff" text-anchor="middle">E</text>
      <text x="88" y="139" font-size="37" fill="#fff" text-anchor="middle">T</text>
      <text x="88" y="172" font-size="37" fill="#fff" text-anchor="middle">L</text>
      <text x="118" y="100" font-size="35" fill="#fff">AT</text>
      <text x="118" y="139" font-size="35" fill="#fff">RUCK</text>
      <text x="118" y="172" font-size="35" fill="#fff">OVE</text>
    </g>
    <text x="132" y="200" font-family="'Arial Black',Arial,sans-serif" font-weight="800" font-size="14" letter-spacing="2.5" fill="#141414" text-anchor="middle">BY AZIMUTH</text>
  </symbol>
</svg>

<script>
  const staff = [
    { name:"Deepak",  desg:"Housekeeping Supervisor",
      addr:"Noida Sector 122, near Parthala Chowk, Radha Kunj Colony", phone:"9958821146" },
    { name:"Delip",   desg:"Housekeeping Staff",
      addr:"Noida Sector 122, near Parthala Chowk, Radha Kunj Colony", phone:"9718432045" },
    { name:"Anshu",   desg:"Housekeeping Staff",
      addr:"Noida Sector 52, Gijod", phone:"7303545437" },
    { name:"Sunil",   desg:"Housekeeping Staff",
      addr:"Noida Sector 51, Hoshiyarpur", phone:"6205435785" },
    { name:"Vansh Singh Fartyal", desg:"Floor Manager",
      addr:"Noida Sector 33, Morna", phone:"9953757491" },
  ];

  const icPhone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9z"/></svg>';
  const icPin   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  const icId    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M7 11h2"/><circle cx="15" cy="12" r="2"/></svg>';
  const icCam   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';

  const wave = '<svg class="wave" viewBox="0 0 340 34" preserveAspectRatio="none"><path d="M0,20 C90,42 250,-2 340,20 L340,34 L0,34 Z" fill="#fff"/></svg>';
  // Real ETL logo file (assets/etl-logo.png). If missing, the SVG fallback shows automatically.
  const LOGO_SRC = "assets/etl-logo.png";
  const wmLogo   = ``;  // watermark removed
  const badgeLogo= `<div class="logo-badge"><svg class="logo-fb"><use href="#etl-logo"/></svg><img class="logo-real" src="${LOGO_SRC}" alt="ETL logo" onload="this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"></div>`;

  const el = document.getElementById("cards");
  staff.forEach(p => {
    const contactVal = p.phone
      ? p.phone
      : '<span class="pending">to be added</span>';
    const phoneRow = `<div class="row"><div class="ic">${icPhone}</div><div><div class="k">Contact</div><div class="v">${contactVal}</div></div></div>`;
    el.insertAdjacentHTML("beforeend", `
      <div class="card">
        ${wmLogo}
        <div class="card-top">
          ${badgeLogo}
          <div class="brand-name">EAT&nbsp;TRUCK&nbsp;LOVE</div>
          <div class="brand-sub">BY AZIMUTH</div>
          ${wave}
        </div>
        <div class="card-body">
          <div class="photo" data-name="${p.name}">${icCam}<span>PHOTO</span></div>
          <div class="emp-name">${p.name}</div>
          <div class="emp-desg">${p.desg}</div>
          <div class="details">
            <div class="row"><div class="ic">${icPin}</div><div><div class="k">Address</div><div class="v">${p.addr}</div></div></div>
            ${phoneRow}
          </div>
        </div>
        <div class="card-foot">
          <div class="sign"><div class="line"></div><small>AUTH. SIGNATURE</small></div>
          <div class="idtag"><b>ETL</b><small>Property of ETL &mdash; if found, return</small></div>
        </div>
      </div>
    `);
  });
</script>
</body>
</html>
